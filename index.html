
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheLinuxIndex 1.0</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');
        body { background: #0b0e14; color: #adbac7; font-family: 'Fira Code', monospace; }
        .result-card { background: #1c2128; border: 1px solid #444c56; border-radius: 8px; }
        .result-card:hover { border-color: #539bf5; }
        .scanning { animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-12">
    <div class="max-w-4xl mx-auto w-full">
        <header class="mb-12 text-center">
            <h1 class="text-5xl font-bold text-white mb-4 tracking-tighter">TheLinuxIndex</h1>
            <p id="status" class="text-blue-500 text-xs tracking-[0.2em] uppercase">Ready for Query</p>
        </header>

        <div class="mb-10">
            <input type="text" id="search-box" placeholder="e.g. Debian 10 amd64" 
                class="w-full bg-[#0d1117] border border-[#30363d] rounded p-5 text-xl text-white focus:outline-none focus:ring-1 focus:ring-blue-500">
            <p class="text-[10px] text-gray-500 mt-2 px-1">PRESS ENTER TO TRIGGER REAL-TIME CRAWL</p>
        </div>

        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        const searchBox = document.getElementById('search-box');
        const resultsDiv = document.getElementById('results');
        const status = document.getElementById('status');

        const WORKER_URL = "https://linuxindexapi.live-by-unix.workers.dev/"; 

        searchBox.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const query = searchBox.value.trim();
                if (!query) return;

                status.innerText = "QUERYING 100+ MIRRORS...";
                status.classList.add('scanning');
                resultsDiv.innerHTML = "";

                try {
                    const response = await fetch(`${WORKER_URL}?q=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    
                    status.classList.remove('scanning');
                    status.innerText = data.length > 0 ? `SYNC COMPLETE: ${data.length} MATCHES` : "NO MATCHES IN GLOBAL INDEX";

                    resultsDiv.innerHTML = data.map(item => `
                        <div class="result-card p-6">
                            <div class="flex flex-col md:flex-row justify-between gap-2 mb-4">
                                <h2 class="text-lg font-bold text-white">${item.name}</h2>
                                <span class="text-[10px] font-mono text-gray-500 bg-black p-1 rounded">${item.hash}</span>
                            </div>
                            <div class="bg-black p-3 rounded mb-4 overflow-hidden">
                                <code class="text-xs text-green-400">wget -c ${item.url}</code>
                            </div>
                            <div class="flex gap-3">
                                <a href="${item.url}" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded text-center text-sm transition">DOWNLOAD</a>
                                <button onclick="alert('Hash archived')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white py-2 rounded text-sm transition">ZIP HASH</button>
                            </div>
                        </div>
                    `).join('');
                } catch (err) {
                    status.innerText = "INDEX UNREACHABLE";
                }
            }
        });
    </script>
</body>
